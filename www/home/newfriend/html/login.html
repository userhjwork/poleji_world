<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>새가족부 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .login-title {
            color: #333;
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }
        .kakao-login-btn {
            background-color: #FEE500;
            color: #000000;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .kakao-login-btn:hover {
            background-color: #FDD835;
            color: #000000;
        }
        .kakao-logo {
            width: 24px;
            height: 24px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 class="login-title">새가족부 지출 관리</h1>
        <p class="mb-4">카카오 계정으로 로그인해주세요.</p>
        <a href="javascript:void(0)" onclick="kakaoLogin()" class="kakao-login-btn">
            <img src="https://developers.kakao.com/assets/img/about/logos/kakaotalksharing/kakaotalk_sharing_btn_medium.png" 
                 alt="Kakao Logo" class="kakao-logo">
            카카오 로그인
        </a>
    </div>

    <script>
        // 카카오 SDK 초기화
        Kakao.init('d41148939f2801ea4222671ee2b5191e');

        // 카카오 로그인
        function kakaoLogin() {
            // 로그인 상태 확인
            Kakao.Auth.getStatusInfo(function(statusObj) {
                if (statusObj.status === 'connected') {
                    // 이미 로그인된 경우 토큰을 서버로 전송
                    Kakao.Auth.getAccessToken().then(function(token) {
                        // 서버로 토큰 전송
                        fetch('./php/kakao_login.php', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                access_token: token
                            })
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                window.location.href = './index_multi_main.php';
                            } else {
                                // 토큰이 유효하지 않은 경우 재로그인
                                Kakao.Auth.authorize({
                                    redirectUri: 'https://poleji.cafe24.com/home/newfriend/html/php/kakao_login_callback.php',
                                    scope: 'profile_nickname,profile_image',
                                    prompt: 'login'
                                });
                            }
                        });
                    });
                } else {
                    // 로그인되지 않은 경우 로그인 페이지로 이동
                    Kakao.Auth.authorize({
                        redirectUri: 'https://poleji.cafe24.com/home/newfriend/html/php/kakao_login_callback.php',
                        scope: 'profile_nickname,profile_image',
                        prompt: 'login'
                    });
                }
            });
        }
    </script>
</body>
</html>
